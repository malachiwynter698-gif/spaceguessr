<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Geoguessr</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #050811; color: #f1f5f9;
    font-family: Arial, Helvetica, sans-serif; display: flex; justify-content: center;
    align-items: center; padding: 18px;
  }
  #app { width: 100%; max-width: 550px; min-height: 600px; }
  .screen { text-align: center; min-height: 600px; display: flex; flex-direction: column; }
  h1 { color: #38bdf8; font: bold 32px "Courier New", monospace; margin: 55px 0 5px; }
  .credit { color: #64748b; font: bold 11px "Courier New", monospace; margin-bottom: 42px; }
  .subtitle { margin-bottom: 14px; }
  button {
    border: 0; border-radius: 6px; padding: 13px 18px; font-weight: bold;
    cursor: pointer; font-size: 15px; touch-action: manipulation;
  }
  .difficulty {
    width: min(300px, 90%); margin: 6px auto; background: #1e293b; color: #f1f5f9;
  }
  .difficulty:active { background: #38bdf8; color: #050811; }
  .quit { background: #991b1b; color: white; margin-top: 40px; }
  .stats { color: #38bdf8; font: bold 15px "Courier New", monospace; margin: 20px 0 10px; }
  .info {
    background: #0f172a; border: 1px solid #1e293b; border-radius: 8px;
    padding: 20px; text-align: left; margin: 15px 0;
  }
  .level { color: #f59e0b; font-weight: bold; }
  .info-line { margin: 8px 0; }
  .hint { color: #94a3b8; font-style: italic; line-height: 1.4; margin-top: 16px; }
  input {
    width: 100%; max-width: 330px; padding: 14px; border: 0; border-radius: 6px;
    background: #1e293b; color: white; text-align: center; font-size: 17px;
    outline: none; margin: 5px auto;
  }
  .actions { display: flex; gap: 12px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
  .lock { background: #10b981; color: white; min-width: 170px; }
  .roundquit { background: #ef4444; color: white; min-width: 150px; }
  .continue { background: #38bdf8; color: #050811; }
  .feedback { min-height: 24px; font: bold 15px "Courier New", monospace; margin: 8px; }
  .success { color: #10b981; }
  .wrong { color: #ef4444; }
  .complete { margin: auto; }
  .complete h2 { color: #10b981; font: bold 28px "Courier New", monospace; }
  .menu { background: #1e293b; color: white; margin-top: 30px; }
  .watermark { margin-top: auto; padding: 15px; color: #334155; font: 10px "Courier New", monospace; }
  @media (max-width: 480px) {
    body { padding: 12px; }
    #app, .screen { min-height: calc(100vh - 24px); }
    h1 { font-size: 27px; margin-top: 42px; }
    .credit { margin-bottom: 30px; }
    .actions button { width: 100%; max-width: 330px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const celestialObjects = [
  {name:"Mars",level:"EASY",type:"Planet",distance:"1.5 AU",hint:"The Red Planet, home to Olympus Mons and the Curiosity rover."},
  {name:"Saturn",level:"EASY",type:"Planet",distance:"9.5 AU",hint:"Famous for its spectacular, extensive ring system made of ice and rock."},
  {name:"Polaris",level:"MEDIUM",type:"Star",distance:"433 light-years",hint:"The North Star, used for centuries by navigators to find true north."},
  {name:"Andromeda",level:"MEDIUM",type:"Galaxy",distance:"2.5 million light-years",hint:"The closest large spiral galaxy to our own Milky Way."},
  {name:"Proxima Centauri",level:"HARD",type:"Star",distance:"4.2 light-years",hint:"The absolute closest star system to our solar system."},
  {name:"Sagittarius A*",level:"HARD",type:"Supermassive Black Hole",distance:"26,000 light-years",hint:"The invisible gravitational monster sitting at the exact center of the Milky Way."},
  {name:"Pillars of Creation",level:"IMPOSSIBLE",type:"Nebula Structure",distance:"6,500 light-years",hint:"Towering fingers of cosmic gas captured by Hubble and Webb."},
  {name:"Oumuamua",level:"IMPOSSIBLE",type:"Interstellar Object",distance:"Varies",hint:"A bizarre, cigar-shaped cosmic traveler passing through our solar system."}
];

let score=0, roundsPlayed=0, availableObjects=[], target=null, showingFeedback=false;

function renderMenu(){
  document.getElementById("app").innerHTML = `
    <div class="screen">
      <h1>SPACE GEOGUESSR</h1>
      <div class="credit">MADE BY MALACHI WYNTER</div>
      <div class="subtitle">CHOOSE YOUR DIFFICULTY LEVEL:</div>
      ${["EASY","MEDIUM","HARD","IMPOSSIBLE","ALL"].map(d=>`<button class="difficulty" onclick="startGame('${d}')">${d}</button>`).join("")}
      <button class="quit" onclick="window.close()">QUIT APPLICATION</button>
    </div>`;
}

function startGame(choice){
  availableObjects = choice === "ALL" ? [...celestialObjects] : celestialObjects.filter(o=>o.level===choice);
  score=0; roundsPlayed=0; showingFeedback=false;
  renderGame(); nextRound();
}

function renderGame(){
  document.getElementById("app").innerHTML = `
    <div class="screen">
      <div id="stats" class="stats"></div>
      <div class="info">
        <div id="level" class="level"></div>
        <div id="type" class="info-line"></div>
        <div id="distance" class="info-line"></div>
        <div id="hint" class="hint"></div>
      </div>
      <div id="feedback" class="feedback"></div>
      <input id="guess" type="text" placeholder="Enter your guess" autocomplete="off">
      <div class="actions">
        <button id="action" class="lock" onclick="submitGuess()">LOCK IN GUESS</button>
        <button class="roundquit" onclick="renderMenu()">QUIT ROUND</button>
      </div>
      <div class="watermark">SYSTEM DESIGN: MALACHI WYNTER</div>
    </div>`;
  document.getElementById("guess").addEventListener("keydown", e=>{ if(e.key==="Enter") submitGuess(); });
  document.getElementById("guess").focus();
}

function nextRound(){
  if(availableObjects.length===0){ showComplete(); return; }
  showingFeedback=false;
  target=availableObjects[Math.floor(Math.random()*availableObjects.length)];
  roundsPlayed++;
  document.getElementById("stats").textContent=`Round: ${roundsPlayed}  |  Score: ${score}`;
  document.getElementById("level").textContent=`DIFFICULTY: ${target.level}`;
  document.getElementById("type").textContent=`RADAR TRACKING TYPE: ${target.type}`;
  document.getElementById("distance").textContent=`APPROXIMATE DISTANCE: ${target.distance}`;
  document.getElementById("hint").textContent=`TELEMETRY LOG: ${target.hint}`;
  document.getElementById("feedback").textContent="";
  const input=document.getElementById("guess");
  input.disabled=false; input.value=""; input.focus();
  const action=document.getElementById("action");
  action.textContent="LOCK IN GUESS"; action.className="lock";
}

function submitGuess(){
  if(showingFeedback){ nextRound(); return; }
  const input=document.getElementById("guess");
  const guess=input.value.trim();
  if(!guess) return;
  input.disabled=true; showingFeedback=true;
  const feedback=document.getElementById("feedback");
  if(guess.toLowerCase()===target.name.toLowerCase()){
    score+=100;
    feedback.textContent="CORRECT TARGET IDENTIFIED!";
    feedback.className="feedback success";
  } else {
    feedback.textContent=`WRONG! TARGET WAS: ${target.name.toUpperCase()}`;
    feedback.className="feedback wrong";
  }
  document.getElementById("stats").textContent=`Round: ${roundsPlayed}  |  Score: ${score}`;
  availableObjects=availableObjects.filter(o=>o!==target);
  const action=document.getElementById("action");
  action.textContent="CONTINUE MISSION"; action.className="continue";
}

function showComplete(){
  document.getElementById("app").innerHTML=`
    <div class="screen">
      <div class="complete">
        <h2>MISSION COMPLETE</h2>
        <p>Final Score: ${score} across ${roundsPlayed} rounds</p>
        <p>Designed by Malachi Wynter</p>
        <button class="menu" onclick="renderMenu()">RETURN TO MAIN MENU</button>
      </div>
    </div>`;
}

renderMenu();
</script>
</body>
</html>
